<!DOCTYPE html>
<html>

<head>
    <title align="center">registration form </title>
    <style>

    </style>
</head>

<body>
    <h1 align="center">REGISTRATION FORM</h1>
    <form action="resg.html" method="post" align="center">
        <label for="name"><b>Name:</b></label>
        <input type="text" id="name" name="name" required><br><br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label><br><br>

        <label for="email"><b>Email:</b></label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password"><b>Password:</b></label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="confirm-password"><b>Confirm Password:</b></label>
        <input type="password" id="confirm-password" name="confirm-password" required><br><br>
        <input type="submit" value="Register" style="background-color: red; color: white; padding: 10px 20px; border: none; cursor: pointer;">

    </form>



</body>

</html>
